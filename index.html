<!DOCTYPE html>
<html lang="en" data-mode="light" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="A UI/UX and front-end portfolio, styled as a pastel retro desktop.">
<script>
/* Set the theme and motion preference before the first paint, so nothing flashes. */
(function () {
  var r = document.documentElement, theme = null, motion = null;
  try {
    theme = JSON.parse(localStorage.getItem('portfolio:theme'));
    motion = JSON.parse(localStorage.getItem('portfolio:motion'));
  } catch (e) {}
  var host = r.getAttribute('data-theme');
  var dark = theme ? theme === 'dark' : (host ? host === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-mode', dark ? 'dark' : 'light');
  var reduce = motion === null ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : !motion;
  r.setAttribute('data-motion', reduce ? 'reduce' : 'full');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<canvas id="sky" aria-hidden="true"></canvas>

<header class="menubar">
  <p class="brand"><span id="brand-mark"></span><span id="brand-name">Portfolio</span></p>
  <nav class="menu" aria-label="Main"><ul id="menu-list"></ul></nav>
  <div class="tray">
    <button type="button" class="tray-btn cursor-toggle" id="cursor-btn" aria-pressed="true" data-sound="none"><span class="tray-ico"></span><span class="tray-label">Pixel cursor</span></button>
    <button type="button" class="tray-btn" id="sound-btn" aria-pressed="true" data-sound="none"><span class="tray-ico"></span><span class="tray-label">Sound</span></button>
    <button type="button" class="tray-btn" id="motion-btn" aria-pressed="true" data-sound="none"><span class="tray-ico"></span><span class="tray-label">Animation</span></button>
    <button type="button" class="tray-btn" id="theme-btn" aria-pressed="false" data-sound="none"><span class="tray-ico"></span><span class="tray-label">Dark mode</span></button>
    <time class="clock" id="clock"></time>
  </div>
</header>

<main class="desktop" id="main" tabindex="-1">
  <section class="hero" aria-labelledby="hero-name">
    <h1 class="hero-name" id="hero-name"></h1>
    <div class="konami-hint" id="konami-hint" aria-hidden="true"></div>
    <div class="hero-plate">
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-ctas">
        <button type="button" class="btn btn-primary" data-open="work" data-sound="none">See my work</button>
        <button type="button" class="btn" data-open="cv" data-sound="none">Read my CV</button>
      </div>
      <p class="hero-status"><span class="dot" aria-hidden="true"></span><span id="hero-status"></span></p>
    </div>
  </section>
  <nav class="icons-nav" aria-label="Desktop shortcuts"><ul class="icons" id="icons"></ul></nav>
  <nav class="icons-nav icons-nav-right" aria-label="Extras"><ul class="icons" id="icons-right"></ul></nav>
  <div class="windows" id="windows"></div>
  <button type="button" class="egg-pad" id="egg-pad" aria-label="Play the secret code" data-sound="none"></button>
  <button type="button" class="chat-head" id="chat-head" data-open="messages" data-sound="none" hidden></button>
</main>

<p id="move-hint" hidden>Use the arrow keys to move this window. Hold Shift to move it further. Press Enter to centre it.</p>
<div class="sr-only" id="announcer" role="status"></div>
<noscript><p class="noscript">This portfolio needs JavaScript to open its windows.</p></noscript>

<script src="js/content.js"></script>

<script src="js/app.js"></script>
</body>
</html>
